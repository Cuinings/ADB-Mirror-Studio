name: Windows CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore unit tests
        run: dotnet restore commercial/tests/AdbMirrorStudio.UnitTests/AdbMirrorStudio.UnitTests.csproj

      - name: Run Release unit tests
        run: >-
          dotnet test
          commercial/tests/AdbMirrorStudio.UnitTests/AdbMirrorStudio.UnitTests.csproj
          --configuration Release
          --no-restore

      - name: Restore Windows x64 app
        run: >-
          dotnet restore
          commercial/src/AdbMirrorStudio.App/AdbMirrorStudio.App.csproj
          --runtime win-x64
          /p:Unpackaged=true

      - name: Build Windows x64 app
        run: >-
          dotnet build
          commercial/src/AdbMirrorStudio.App/AdbMirrorStudio.App.csproj
          --configuration Release
          --runtime win-x64
          --no-restore
          /p:Unpackaged=true
